name: Production Ops Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: internal/backend/go.mod
          cache-dependency-path: internal/backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.4
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: internal/frontend
      - name: Check shell scripts
        run: for file in scripts/*.sh; do bash -n "$file"; done
      - name: Exercise production operation safety paths
        run: scripts/test-production-ops.sh
      - name: Run backend tests
        run: make backend-test
      - name: Run frontend unit tests
        run: |
          pnpm run test:navbar
          pnpm run test:micro-specialty
          pnpm run test:public-site
          pnpm run test:route-motion
          pnpm run test:progress
          pnpm run test:workbench
          pnpm run test:email-templates
          pnpm run test:auth-flow
          pnpm run test:daily-signal
        working-directory: internal/frontend
      - name: Typecheck frontend
        run: pnpm run typecheck
        working-directory: internal/frontend
      - name: Build frontend
        run: pnpm run build
        working-directory: internal/frontend
