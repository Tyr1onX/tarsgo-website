name: Production Ops Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      deploy_required: ${{ steps.deploy_changes.outputs.deploy_required }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check deployment changes
        id: deploy_changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null &&
             git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- . ':(exclude,glob)**/*.md'; then
            echo 'deploy_required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy_required=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: internal/backend/go.mod
          cache-dependency-path: internal/backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: internal/frontend/.nvmrc
      - name: Check shell scripts
        run: for file in scripts/*.sh; do bash -n "$file"; done
      - name: Exercise local startup readiness paths
        run: scripts/test-dev-startup.sh
      - name: Exercise production operation safety paths
        run: scripts/test-production-ops.sh
      - name: Run backend tests
        run: make backend-test
      - name: Run frontend checks and build release binaries
        run: make frontend-test frontend-check build-linux-amd64
      - name: Package production release
        run: |
          release_dir=dist/production-release
          mkdir -p "$release_dir"
          cp scripts/production.Dockerfile "$release_dir/Dockerfile"
          cp dist/tarsgo-backend-linux-amd64 dist/tarsgo-migrate-linux-amd64 "$release_dir/"
          printf '%s\n' "$GITHUB_SHA" >"$release_dir/commit.txt"
          (
            cd "$release_dir"
            sha256sum Dockerfile commit.txt tarsgo-backend-linux-amd64 tarsgo-migrate-linux-amd64 >SHA256SUMS
            sha256sum --check -- SHA256SUMS
          )
      - name: Store production release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarsgo-production-release
          path: dist/production-release/
          if-no-files-found: error

  database-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root
          MARIADB_DATABASE: tarsgo_acceptance
          MARIADB_USER: tarsgo_test
          MARIADB_PASSWORD: isolated-ci-only
        ports:
          - 3317:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TARSGO_QA_TEST_DSN: "tarsgo_test:isolated-ci-only@tcp(127.0.0.1:3317)/tarsgo_acceptance?charset=utf8mb4&parseTime=true&loc=UTC"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: internal/backend/go.mod
          cache-dependency-path: internal/backend/go.sum
      - name: Run mandatory synthetic MariaDB workflows and migrations
        run: python3 scripts/test-database-integration.py

  publish-production-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, database-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified production release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarsgo-production-release
          path: dist/production-release
      - name: Package production release archive
        run: |
          tar -czf dist/tarsgo-production-release.tar.gz -C dist/production-release \
            Dockerfile SHA256SUMS commit.txt tarsgo-backend-linux-amd64 tarsgo-migrate-linux-amd64
          (
            cd dist
            sha256sum tarsgo-production-release.tar.gz >tarsgo-production-release.tar.gz.sha256
          )
      - name: Publish public production release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view production-artifacts --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create production-artifacts \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Production build artifact" \
              --notes "由 production-ops.yml 自动更新。部署前会校验构建提交和 SHA-256。"
          fi
          gh release upload production-artifacts dist/tarsgo-production-release.tar.gz \
            dist/tarsgo-production-release.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.deploy_required == 'true'
    needs: [publish-production-release, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure production SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.PRODUCTION_SSH_TARGET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_KNOWN_HOSTS" || -z "$DEPLOY_TARGET" || -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Configure PRODUCTION_SSH_PRIVATE_KEY, PRODUCTION_SSH_KNOWN_HOSTS, PRODUCTION_SSH_TARGET, PRODUCTION_CLOUDFLARE_API_TOKEN and PRODUCTION_CLOUDFLARE_ACCOUNT_ID repository secrets.'
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: internal/frontend/.nvmrc
      - name: Install Cloudflare CLI
        run: npm install --global cf@1.0.0-beta.25
      - name: Deploy verified release to production
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TARGET: ${{ secrets.PRODUCTION_SSH_TARGET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy-production.sh
