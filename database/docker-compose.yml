services:
  mariadb:
    image: mariadb:11.4
    container_name: tarsgo-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-tarsgo}
      MARIADB_USER: ${MARIADB_USER:-tarsgo}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-tarsgo_dev_change_me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_change_me}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - tarsgo_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tarsgo_mariadb_data:
